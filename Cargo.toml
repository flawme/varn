[package]
name = "varn"
version = "0.1.0"
edition = "2024"
description = "Local state checkpointing and rollback system"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
