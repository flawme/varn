[package]
name = "varn"
version = "0.3.0"
edition = "2024"
description = "Local state checkpointing and rollback system"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
filetime = "0.2"

# Platform-specific metadata support. Each is only compiled for its target.
# - libc: BSD file flags (macOS st_flags / chflags)
# - windows-sys: hard link identity (GetFileInformationByHandle) and
#   security descriptors (Get/SetNamedSecurityInfoW)
#
# Both are pinned to exact versions with `=`. windows-sys is a 0.x crate
# whose minor releases are NOT API-stable (0.59 -> 0.61 moved
# SECURITY_DESCRIPTOR_REVISION to a different module and changed GENERIC_READ
# from a newtype to a plain u32); a loose range would let a fresh
# `cargo update` break the build. Upgrade deliberately: bump the pin, fix
# compile errors, commit both together.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "=0.2.189"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.59.0", features = [
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_SystemServices",
    "Win32_Foundation",
] }

[dev-dependencies]
tempfile = "3"
filetime = "0.2"
