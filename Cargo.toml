[package]
name = "varn"
version = "0.2.0"
edition = "2024"
description = "Local state checkpointing and rollback system"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
filetime = "0.2"

# Platform-specific metadata support. Each is only compiled for its target.
# - libc: BSD file flags (macOS st_flags / chflags)
# - windows-sys: hard link identity (GetFileInformationByHandle) and
#   security descriptors (Get/SetNamedSecurityInfoW)
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Foundation",
] }

[dev-dependencies]
tempfile = "3"
filetime = "0.2"
