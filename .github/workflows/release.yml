name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: varn-linux-x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: varn-macos-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: varn-windows-x86_64.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary (Unix)
        if: runner.os != 'Windows'
        run: cp target/${{ matrix.target }}/release/varn ${{ matrix.artifact }}

      - name: Rename binary (Windows)
        if: runner.os == 'Windows'
        run: copy target\${{ matrix.target }}\release\varn.exe ${{ matrix.artifact }}

      - name: Compute SHA-256 (Unix)
        if: runner.os != 'Windows'
        run: sha256sum ${{ matrix.artifact }} > ${{ matrix.artifact }}.sha256

      - name: Compute SHA-256 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          (Get-FileHash -Algorithm SHA256 "${{ matrix.artifact }}").Hash.ToLower() + "  ${{ matrix.artifact }}" |
            Out-File -NoNewline -Encoding ascii "${{ matrix.artifact }}.sha256"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.artifact }}
            ${{ matrix.artifact }}.sha256

  checksums:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all release assets
        run: |
          gh release download "$TAG" --repo "$REPO" --dir assets
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}

      - name: Build aggregated SHA256SUMS.txt
        run: |
          cd assets
          # Hash only the binaries; the per-asset .sha256 files are excluded.
          sha256sum varn-* | grep -v '\.sha256' > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload SHA256SUMS.txt to release
        uses: softprops/action-gh-release@v2
        with:
          files: assets/SHA256SUMS.txt
